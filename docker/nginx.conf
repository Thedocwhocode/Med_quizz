# The manager area is private and game rooms are ephemeral: keep both out of
# search results. Matching on `$request_uri` is what makes this work -- the SPA
# fallback is an internal redirect to /index.html, after which nginx re-selects
# the location, and `add_header` is not inherited across that switch. A header
# set in a `location /manager` block would therefore be dropped on exactly the
# responses that need it, since those paths never map to a real file.
# The routes stay crawlable on purpose: a crawler only reads `X-Robots-Tag` on
# a URL it is allowed to fetch.
map $request_uri $robots_tag {
    default             "";
    ~^/manager(/|\?|$)  "noindex, nofollow";
    ~^/party(/|\?|$)    "noindex, nofollow";
}

server {
    listen 3000;

    root /app/web;
    index index.html;

    location / {
        # nginx omits the header entirely when the mapped value is empty.
        add_header X-Robots-Tag $robots_tag always;

        # `$uri.html` serves the statically rendered content pages at clean paths
        # (`/sobre` -> `sobre.html`) before falling back to the SPA shell.
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /branding/ {
        alias /app/config/branding/;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
